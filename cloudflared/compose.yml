networks:
  default:
    external: true
    name: ${DOCKER_MY_NETWORK}
services:
  tunnel:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      default:
        ipv4_address: 172.20.0.32

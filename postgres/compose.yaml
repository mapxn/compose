networks:
  default:
    external: true
    name: ${DOCKER_MY_NETWORK}
services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    #    ports:
    #      - 5432:5432
    volumes:
      - ${DOCKER_HOME}/postgres/data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      POSTGRES_USER: pama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tree
    networks:
      default:
        ipv4_address: 172.20.0.19
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 500M

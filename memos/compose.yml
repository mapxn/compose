networks:
  default:
    external: true
    name: ${DOCKER_MY_NETWORK}
services:
  memos:
    image: ghcr.io/usememos/memos:stable
    container_name: memos
    volumes:
      - ${DOCKER_HOME}/memos/data/:/var/opt/memos
    environment:
      TZ: Asia/Shanghai
    # ports:
    #     - '5230:5230'
    #command:
    #  - --metric=false
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.20.0.9
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M

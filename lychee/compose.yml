networks:
  default:
    external: true
    name: ${DOCKER_MY_NETWORK}
services:
  lychee:
    container_name: lychee
    image: lycheeorg/lychee
    restart: unless-stopped
    # ports:
    #   - "80:80"
    environment:
      PUID: 1000
      PGID: 1000
      PHP_TZ: ${TZ}
      DB_CONNECTION: sqlite
      APP_URL: ${APP_URL}
      LYCHEE_UPLOADS_URL: '/uploads'
    volumes:
      - ${DOCKER_HOME}/lychee/conf:/conf
      - ${DOCKER_HOME}/lychee/uploads:/uploads
      - ${DOCKER_HOME}/lychee/sym:/sym
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      default:
        ipv4_address: 172.20.0.41
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M
